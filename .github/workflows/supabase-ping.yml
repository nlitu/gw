name: Supabase Keep-Alive Ping

# Ping Supabase tiap hari supaya project gratis tidak di-pause karena tidak aktif.
# Membutuhkan 2 repository secret: SUPABASE_URL dan SUPABASE_ANON_KEY (lihat README.md).
on:
  schedule:
    - cron: "0 3 * * *"   # setiap hari 03:00 UTC (10:00 WIB)
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TABLE: gw_state
    steps:
      - name: Cek secret
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum dibuat. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Ping tabel gw_state
        run: |
          BASE="${SUPABASE_URL%/}"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/res.json -w "%{http_code}" \
              "$BASE/rest/v1/$TABLE?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY") || code=000
            echo "Percobaan $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "OK: $(cat /tmp/res.json)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Ping gagal: $(cat /tmp/res.json 2>/dev/null)"
          exit 1
