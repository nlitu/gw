<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Guessing Words</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b2333;--mu:#69728a;--bd:#dfe3ee;--ac:#4f46e5;--ok:#15803d;--wr:#b45309;--bad:#dc2626;--hl:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141c;--cd:#1a1f2c;--tx:#e8ebf4;--mu:#98a1b9;--bd:#2c3345;--ac:#818cf8;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;--hl:#232a44}}
:root[data-theme="dark"]{--bg:#11141c;--cd:#1a1f2c;--tx:#e8ebf4;--mu:#98a1b9;--bd:#2c3345;--ac:#818cf8;--ok:#4ade80;--wr:#fbbf24;--bad:#f87171;--hl:#232a44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:0 0 10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--bad)}
input[type=number]{width:64px}input[type=checkbox]{width:20px;height:20px}
textarea{width:100%;box-sizing:border-box;margin:6px 0}
.fr{display:flex;gap:6px}.fr input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.chip input{width:78px;border:0;border-radius:0}.chip button{border:0;border-radius:0;color:var(--bad)}
.sg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.3fr auto;gap:6px;align-items:end;margin-bottom:8px}
.sg label{font-size:.75rem;color:var(--mu);display:block}.sg input{width:100%;box-sizing:border-box}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:.75rem;color:var(--mu);font-weight:600}
tr.dn{background:var(--hl)}td.nm{font-weight:600}
.w{display:flex;gap:3px;align-items:center}.w input{width:52px;text-align:center}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ac);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tb.over{background:var(--bad)}.tb b{font-size:2.8rem;font-variant-numeric:tabular-nums}
#pj{display:none;position:fixed;inset:0;z-index:99;background:#0b0f1a;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
#pj.warn{background:#92400e}
#pj.over{background:#7f1d1d}.pwn{font-size:6vw;font-weight:800;color:#fde047;min-height:1.2em}
.pst{font-size:3vw;opacity:.7}.pnm{font-size:8vw;font-weight:800;line-height:1.1}
.ptm{font-size:17vw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.psb{font-size:3.5vw;opacity:.85}
.prow{margin-top:24px;display:flex;gap:16px}.prow button{font-size:clamp(16px,2.4vw,34px);padding:12px 30px}
#pj select{font-size:clamp(20px,5vw,60px);max-width:90%}
.mu{color:var(--mu);font-size:.85rem}.tie{color:var(--wr);font-weight:600}.ok{color:var(--ok);font-weight:600}
.pod{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pod div{flex:1;min-width:140px;text-align:center;border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--hl)}
.pod .m{font-size:2rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
@media(max-width:560px){.sg{grid-template-columns:1fr 1fr}}
/* === tema biru & oranye === */
:root{--bg:#eef4fc;--cd:#fff;--tx:#12203d;--mu:#5d6b88;--bd:#dbe4f3;--hl:#f1f6fd;--ac:#14306b;--acx:#fff;--gold:#f5a524;--ok:#1f7a4d;--wr:#b45309;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--cd:#11203d;--tx:#eaf0fb;--mu:#93a4c4;--bd:#23375f;--hl:#182a4d;--ac:#f5b04a;--acx:#0f1d38;--gold:#f5b04a;--ok:#6fd3a0;--wr:#ffc766;--bad:#ff8f80}}
:root[data-theme="dark"]{--bg:#0a1428;--cd:#11203d;--tx:#eaf0fb;--mu:#93a4c4;--bd:#23375f;--hl:#182a4d;--ac:#f5b04a;--acx:#0f1d38;--gold:#f5b04a;--ok:#6fd3a0;--wr:#ffc766;--bad:#ff8f80}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:1040px}
.hd{display:flex;align-items:center;gap:28px;background:linear-gradient(120deg,#0d2557,#1e56b3);color:#fff;padding:22px 32px;border-radius:18px;margin-bottom:18px;border-bottom:4px solid #f6a623;box-shadow:0 10px 28px rgba(20,48,107,.28)}
.hd img{width:164px;height:auto;flex:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.tt{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1.3rem,4.2vw,2.3rem);letter-spacing:.1em;line-height:1.15}
.sb{color:#ffc766;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;margin-top:8px}
@media(max-width:560px){.hd{gap:14px;padding:16px}.hd img{width:88px}}
.c{border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(20,48,107,.06)}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:1.2rem;padding-bottom:8px;border-bottom:2px solid var(--gold);margin:0 0 14px;display:inline-block;min-width:40%}
.row h2{border:0;padding:0;min-width:0}
button,input,textarea,select{border-radius:8px}
button{font-weight:500;transition:border-color .15s,background .15s}
button:hover{border-color:var(--gold)}
button.p,.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tabs button{padding:8px 18px}
.pdfb{margin-left:auto;background:#f6a623;border-color:#f6a623;color:#3a2600;font-weight:600}
.pdfb:hover{border-color:#14306b}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
th{color:var(--mu);border-bottom:2px solid var(--gold);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
tr.dn{background:var(--hl)}td{border-bottom:1px solid var(--bd)}
.chip{background:var(--hl);border-radius:10px}
.tb{background:linear-gradient(120deg,#0d2557,#1e56b3);color:#fff;border-radius:12px;border-bottom:3px solid #f6a623}
.tb.over{background:#8f1f1f}.tb b{font-weight:300}
.pod div{background:var(--hl);color:var(--tx);border:1px solid var(--gold);border-radius:14px}
.pod div:first-child{border-width:2px;transform:scale(1.04)}
.pod .m{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-weight:700;font-size:2.2rem}
#pj{background:radial-gradient(ellipse at 50% 15%,#1e56b3,#0f2a5e 55%,#08183a)}
#pj.warn{background:radial-gradient(ellipse at 50% 15%,#b9700a,#6b3d05 70%)}#pj.over{background:radial-gradient(ellipse at 50% 15%,#a12626,#4a1010 70%)}
.plg{height:19vh;width:auto;margin-bottom:1vh;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.pst{color:#ffc766;letter-spacing:.4em;text-transform:uppercase}
.pnm{font-family:'Playfair Display',Georgia,serif;color:#fff;text-shadow:none;font-weight:700}
.ptm{font-family:'Inter',system-ui,sans-serif;font-weight:300;text-shadow:0 4px 30px rgba(0,0,0,.25);color:#fff}
.psb{color:#cfe0ff}.pwn{color:#ffd98a}
#pj button{background:transparent;color:#fff;border:1px solid #f6a623;border-radius:8px}
#pj button.p{background:#f6a623;color:#2b1c00}
#pj select{background:#0f2a5e;color:#fff;border-color:#f6a623}
</style></head>

function rowH(si,ri,id,n,r){const st=S.stages[si];r=r||{};const a=`${si},${ri},'${id}'`,run=T.on&&T.id==id&&T.ri==ri&&T.si==si;
 const over=st.time>0&&r.t>st.time;
 return `<tr class="${r.done?'dn':''}"><td>${n}</td><td class="nm">${esc(tn(id))}</td>
<td><div class="w"><button onclick="ch(${a},'w',-1)">−</button><input type="number" min="0" value="${r.w||0}" onchange="sf(${a},'w',this.value)"><button onclick="ch(${a},'w',1)">+</button></div></td>
<td><input type="number" min="0" step="0.01" style="width:84px" value="${r.t||0}" onchange="sf(${a},'t',this.value)"> <span class="mu" ${over?'style="color:var(--bad)"':''}>${fmt(r.t||0)}</span></td>
<td><input type="number" min="0" value="${r.p||0}" onchange="sf(${a},'p',this.value)"></td>
<td><b>${r.done?scv(st,r):'–'}</b></td>
<td><button class="${run?'p':''}" onclick="tm(${a})">${run?'Stop':'Mulai'}</button></td>
<td><input type="checkbox" ${r.done?'checked':''} onchange="sf(${a},'done',this.checked)"></td>
<td>${ri<0?`<button onclick="mv(${si},'${id}',-1)">▲</button><button onclick="mv(${si},'${id}',1)">▼</button> `:''}<button onclick="clr(${a})">↺</button></td></tr>`}
const HEAD='<tr><th>#</th><th>Kelas</th><th>Kata benar</th><th>Waktu (dtk)</th><th>Pinalti</th><th>Skor</th><th>Timer</th><th>Selesai</th><th>Urut/Reset</th></tr>';

function rankT(i){const st=S.stages[i],nx=S.stages[i+1],r=rank(i);
 return `<div class="sc"><table><tr><th>Peringkat</th><th>Kelas</th><th>Kata</th><th>Waktu</th><th>Skor</th><th>Status</th></tr>${r.map(x=>{const q=st.res[x.id]||{};
 const same=x.dn&&r.filter(y=>y.rk==x.rk).length>1;
 let s='';if(same)s='<span class="tie">SERI</span> ';
 if(last(i)){if(x.dn&&x.rk<=3&&!same)s+='<span class="ok">'+['Juara 1','Juara 2','Juara 3'][x.rk-1]+'</span>'}
 else if(nx&&nx.teamIds&&nx.teamIds.includes(x.id))s+='<span class="ok">Lolos ✔</span>';
 return `<tr><td><b>${x.rk}</b></td><td class="nm">${esc(tn(x.id))}</td><td>${x.dn?q.w:'–'}</td><td>${x.dn?fmt(q.t):'–'}</td><td>${x.dn?scv(st,q):'–'}</td><td>${s}</td></tr>`}).join('')}</table></div>`}

function vPlay(){
 if(!S.stages.length)return '<div class="c">Tambahkan stage dulu di tab Pengaturan.</div>';
 if(S.cur>=S.stages.length)S.cur=0;
 const i=S.cur,st=S.stages[i],o=order(i),ti=tieInfo(i);
 let h=`<div class="tabs">${S.stages.map((s,k)=>`<button class="${k==i?'on':''}" onclick="pick(${k})">${esc(s.name)}</button>`).join('')}</div>`;
 if(T.on)h+=`<div class="tb${(Date.now()-T.t0)/1000>st.time&&st.time?' over':''}" id="swb"><span>${esc(tn(T.id))} · batas ${fmt(S.stages[T.si].time)}</span><span id="swm" style="font-weight:700"></span><b id="sw">${fmt((Date.now()-T.t0)/1000)}</b></div>`;
 if(!o.length)return h+`<div class="c">${i==0?'Belum ada kelas. Tambahkan di tab Pengaturan.':'Belum ada tim di stage ini. Tetapkan tim lolos dari stage sebelumnya.'}</div>`;
 h+=`<div class="c"><div class="row"><h2 style="margin:0">${esc(st.name)}</h2><span class="mu">${o.length} tim · ${st.time} dtk · ${st.pts} poin/kata</span><button onclick="shuffle(${i})">Acak urutan</button><button class="p" onclick="P.open=true;ac();pj()">Layar Proyektor</button></div>
<p class="mu" style="margin-top:0">Urutan bisa diatur manual dengan ▲▼. Skor = kata benar × poin + bonus waktu (sisa waktu × bonus/detik, hanya jika ada kata benar) − pinalti. Jika skor sama, waktu tercepat menang.</p>
<div class="sc"><table>${HEAD}${o.map((id,k)=>rowH(i,-1,id,k+1,st.res[id])).join('')}</table></div></div>`;
 h+=`<div class="c"><h2>Klasemen ${esc(st.name)}</h2>${rankT(i)}`;
 if(ti.all.length)h+=`<p class="tie">⚠ Ada tim dengan skor & waktu sama${ti.rel.length?' pada posisi penentu':''}: ${ti.all.map(x=>esc(tn(x))).join(', ')}</p><button onclick="openRm(${i})">Pilih tim untuk tanding ulang</button>`;
 if(S.rmOpen===i)h+=`<div class="c" style="margin-top:10px"><b>Pilih tim tanding ulang</b><div class="chips">${ti.all.map(id=>`<label class="chip" style="padding:6px 10px;gap:6px"><input type="checkbox" style="width:auto" ${S.rmSel.includes(id)?'checked':''} onchange="tg('${id}')">${esc(tn(id))}</label>`).join('')}</div><div class="row" style="margin-top:8px"><button class="p" onclick="mkRm(${i})">Mulai tanding ulang</button><button onclick="S.rmOpen=null;render()">Batal</button></div></div>`;
 h+='</div>';
 st.rm.forEach((m,k)=>{h+=`<div class="c"><div class="row"><h2 style="margin:0">Tanding ulang #${k+1}</h2><button class="d" onclick="delRm(${i},${k})">Hapus</button></div><div class="sc"><table>${HEAD}${m.ids.map((id,n)=>rowH(i,k,id,n+1,m.res[id])).join('')}</table></div></div>`});
 if(!last(i))h+=`<div class="c"><h2>Tetapkan tim lolos</h2><div class="row"><span>Jumlah tim lolos ke ${esc(S.stages[i+1].name)}:</span><input type="number" min="1" value="${st.q}" onchange="es(${i},'q',this.value)"><button class="p" onclick="adv(${i})">Tetapkan ${st.q||'…'} tim teratas →</button></div></div>`;
 else h+=`<div class="c mu">Ini stage terakhir: peringkat menentukan juara. Lihat tab Hasil Akhir.</div>`;
 return h}

function vRes(){
 if(!S.stages.length)return '<div class="c">Belum ada stage.</div>';
 const li=S.stages.length-1,r=rank(li).filter(x=>x.dn&&x.rk<=3);let h='';
 h+=`<div class="c"><h2>Juara — ${esc(S.stages[li].name)}</h2>`;
 if(!r.length)h+='<p class="mu">Belum ada hasil di stage terakhir.</p>';
 else{h+='<div class="pod">'+r.map(x=>`<div><div class="m">${['I','II','III'][x.rk-1]}</div><b>${esc(tn(x.id))}</b><div class="mu">Peringkat ${x.rk}</div></div>`).join('')+'</div>';
  const ti=tieInfo(li);if(ti.rel.length)h+='<p class="tie">⚠ Masih ada seri di posisi juara. Lakukan tanding ulang di tab Pertandingan.</p>'}
 h+='</div>';
 S.stages.forEach((s,i)=>{h+=`<div class="c"><h2>${esc(s.name)}</h2>${parts(i).length?rankT(i):'<span class="mu">Belum ada peserta.</span>'}</div>`});
 return h+'<div class="row"><button class="p" onclick="pdf()">Unduh PDF Rekap (Stage 1 – Final)</button></div>'}

function render(){
 const t=S.tab;
 $('#app').innerHTML=`<header class="hd"><img src="${LOGO}" alt="Guessing Word Competition"><div><div class="tt">ENGLISH GUESSING WORDS</div><div class="sb">Panel Juri · Penilaian &amp; Rekapitulasi · <span id="sbs" onclick="sbPush()" style="cursor:pointer;text-transform:none;letter-spacing:.02em" title="Klik untuk sinkron ulang ke database">${SBT}</span></div></div></header><div class="tabs">
<button class="${t=='set'?'on':''}" onclick="go('set')">Pengaturan</button>
<button class="${t=='play'?'on':''}" onclick="go('play')">Pertandingan</button>
<button class="${t=='res'?'on':''}" onclick="go('res')">Hasil Akhir</button><button class="pdfb" onclick="pdf()">Unduh PDF Rekap</button></div>`+(t=='set'?vSet():t=='play'?vPlay():vRes());
 pj();save()}
render();sbInit();
</script></body></html>
